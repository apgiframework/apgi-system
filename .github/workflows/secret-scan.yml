name: Secret scanning

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The binary is pinned by checksum instead of using the marketplace action,
      # which needs a paid licence key for organisation repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan history and working tree
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --report-format sarif --report-path gitleaks.sarif

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
