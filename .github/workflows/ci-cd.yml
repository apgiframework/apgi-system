name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/apgi-api

jobs:
  # Job 1: Run tests and linting
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: apgi_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: apgi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      
      - name: Run black formatter check
        run: |
          black --check --diff apgi_framework api tests
          
      - name: Run isort check
        run: |
          isort --check-only --diff apgi_framework/ api/
          
      - name: Run pydocstyle check
        run: |
          pydocstyle apgi_framework/ --convention=google
      
      - name: Run flake8 linter
        run: |
          flake8 apgi_framework api tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 apgi_framework api tests --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      
      - name: Run mypy type checker
        run: |
          mypy apgi_framework api --ignore-missing-imports --no-strict-optional --allow-untyped-calls --allow-untyped-defs

      - name: Run Bandit (SAST)
        run: |
          bandit -r apgi_framework/ api/ -ll -ii

      - name: Run Semgrep Security & Style Scan
        run: |
          pip install semgrep
          semgrep --config .semgrep.yml --error --strict apgi_framework/ api/ tests/ || exit 1

      - name: Run mutmut (Mutation Testing)
        run: |
          mutmut run --paths-to-mutate apgi_framework/
      
      - name: Run unit tests with 90% coverage enforcement
        env:
          DATABASE_URL: postgresql://apgi_test:test_password@localhost:5432/apgi_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/unit/ -v --cov=apgi_framework --cov=api --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=90 --ignore=tests/unit/test_gui.py
      
      - name: Run property-based tests
        env:
          DATABASE_URL: postgresql://apgi_test:test_password@localhost:5432/apgi_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/property/ -v --tb=short
      
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://apgi_test:test_password@localhost:5432/apgi_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: |
          pytest tests/integration/ -v --tb=short
          
      - name: Run load testing
        run: |
          locust -f tests/load/locustfile.py --headless -u 100 -r 10
          
      - name: Run performance benchmarks
        run: |
          pytest tests/benchmarks/ --benchmark-compare --benchmark-fail-on-delta-rms=10%

      - name: Create performance baseline
        env:
          DATABASE_URL: postgresql://apgi_test:test_password@localhost:5432/apgi_test
          REDIS_URL: redis://localhost:6379/0
          API_BASE_URL: http://localhost:8000
        run: |
          # Start API server in background
          python -c "from api.main import app; import uvicorn; uvicorn.run(app, host='0.0.0.0', port=8000, log_level='error')" &
          SERVER_PID=$!
          sleep 5

          # Create baseline if it doesn't exist
          if [ ! -f benchmarks/baselines.json ]; then
            echo "Creating initial performance baseline..."
            pytest benchmarks/test_performance_gates.py::TestPerformanceGates::test_create_performance_baseline -v
          fi

          # Kill server
          kill $SERVER_PID || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            htmlcov/
            .coverage
            coverage.xml

  # Job 2: Performance profiling with py-spy
  profile:
    name: Performance Profiling
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies and py-spy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install py-spy

      - name: Create profiling script
        run: |
          cat > profile_target.py << 'EOF'
          import time
          from apgi_framework.core.active_inference import ActiveInferenceModel
          model = ActiveInferenceModel()
          for i in range(100):
              model.run_inference([1.0, 2.0, 3.0])
              time.sleep(0.1)
          EOF

      - name: Run py-spy profiling on critical path
        run: |
          # Start a background process running the simulation
          python profile_target.py &
          PID=$!
          sleep 2
          # Profile for 10 seconds
          py-spy record -d 10 -o profile.svg --pid $PID || true
          kill $PID || true
        timeout-minutes: 2

      - name: Generate flamegraph report
        run: |
          # Run py-spy top to get text-based report
          python profile_target.py &
          PID=$!
          sleep 1
          py-spy top --pid $PID -d 5 || true
          kill $PID || true
        timeout-minutes: 1

      - name: Archive profiling results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiling-results
          path: |
            profile.svg
            *.prof

  # Job 3: Build Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    needs: test
    if: github.event_name == 'push'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Run pip-audit dependency check
        run: |
          pip-audit
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Validate SBOM
        run: |
          if [ ! -f sbom.spdx.json ]; then
            echo "ERROR: SBOM file was not generated"
            exit 1
          fi
          if ! jq empty sbom.spdx.json 2>/dev/null; then
            echo "ERROR: SBOM is not valid JSON"
            exit 1
          fi
          echo "SBOM validated successfully"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
