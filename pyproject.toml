[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apgi-system"
dynamic = ["version"]
description = "Allostatic Precision-Gated Ignition Framework"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "APGI Team"}
]
keywords = [
    "active-inference",
    "free-energy-principle",
    "predictive-processing",
    "computational-neuroscience",
    "cognitive-modeling",
    "neural-simulation",
    "allostasis",
    "interoception",
    "testing",
    "coverage",
    "property-based-testing",
    "consciousness-research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "jupyter>=1.0.0",
    "psutil>=5.9.0",
    "orjson>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/lesoto/apgi-simulation"
Documentation = "https://github.com/lesoto/apgi-simulation/blob/main/docs/README.md"
Repository = "https://github.com/lesoto/apgi-simulation"
"Bug Tracker" = "https://github.com/lesoto/apgi-simulation/issues"
Changelog = "https://github.com/lesoto/apgi-simulation/blob/main/CHANGELOG.md"

[project.scripts]
apgi-simulate = "apgi_framework.cli:main"
apgi-analysis = "apgi_framework.analysis:cli_main"
apgi-test = "apgi_framework.testing.main:main"
apgi-test-gui = "apgi_framework.testing.main:main"
apgi-coverage = "apgi_framework.testing.main:main"
apgi-deploy = "apgi_framework.deployment.automation:main"
apgi-dashboard = "apgi_framework.gui.interactive_dashboard:main"

[project.gui-scripts]
apgi-gui = "apgi_gui.cli:main"

[project.optional-dependencies]
gui = [
    "Pillow>=9.0.0",
    "customtkinter>=5.2.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "starlette>=0.36.3",
    "pydantic>=2.8.0",
]
ml = [
    "jax>=0.4.13",
    "jaxlib>=0.4.13",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "tensorflow>=2.8",
]
neural = [
    "mne>=1.4.0",
    "nibabel>=5.1.0",
    "numba>=0.57.0",
    "h5py>=3.9.0",
]
dev = [
    "black>=23.0.0",
    "jsonschema>=4.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "isort>=5.12.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "pytest-xvfb>=3.0.0",
    "hypothesis>=6.82.0",
