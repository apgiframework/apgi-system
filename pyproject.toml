    "pre-commit>=2.0",
    "sphinx>=8.0",
    "sphinx-rtd-theme>=2.0",
    "py-spy>=0.3.0",
]
testing = [
    "hypothesis>=6.82.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "sqlalchemy>=2.0.0",
    "redis>=4.0.0",
]
visualization = [
    "plotly>=5.15.0",
]
web = [
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "streamlit>=1.25.0",
    "jinja2>=3.1.0",
]
reporting = [
    "reportlab>=3.6.0",
    "opencv-python>=4.8.0",
]
performance = [
    "memory-profiler>=0.60",
    "line-profiler>=3.0",
]
all = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pytest>=7.4.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0",
    "pre-commit>=2.0",
    "sphinx>=8.0",
    "sphinx-rtd-theme>=2.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "tensorflow>=2.8",
    "mne>=1.4.0",
    "nibabel>=5.1.0",
    "numba>=0.57.0",
    "h5py>=3.9.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "streamlit>=1.25.0",
    "jinja2>=3.1.0",
    "reportlab>=3.6.0",
    "opencv-python>=4.8.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "psutil>=5.9.0",
    "memory-profiler>=0.60",
    "line-profiler>=3.0",
    "statsmodels>=0.14.0",
    "requests>=2.31.0",
]

[tool.setuptools]
packages = ["apgi_gui", "api", "apgi_framework", "tests"]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
apgi_gui = ["py.typed", "resources/**/*"]
api = ["py.typed"]
apgi_framework = [
    "gui/templates/*.html",
    "gui/static/*",
    "config/*.json",
    "config/*.yaml",
    "data/*.json",
    "testing/templates/*",
]

[tool.setuptools.dynamic]
version = {attr = "apgi_framework.__version__"}

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests", "apgi_framework/tests", "research"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=apgi_framework",
    "--cov=api",
    "--cov-branch",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
    "--cov-report=xml:coverage.xml",
]
markers = [
    "unit: Unit tests for individual components",
    "property: Property-based tests using Hypothesis",
    "integration: Integration tests for subsystem interactions",
    "slow: Tests that take significant time to run",
    "edge_case: Tests for edge cases and boundary conditions",
    "gui: marks tests that require GUI/display",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["apgi_framework", "api"]
omit = [
    "**/apgi_gui.py",
    "**/*_GUI.py",
    "**/tests/*",
    "**/conftest.py",
    "**/__pycache__/*",
    "**/.*",
    "*/site-packages/*",
    "*/dist/*",
    "*/build/*",
    "*/.tox/*",
    "*/.eggs/*",
]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]
# Clean up stale coverage data to prevent DB corruption
disable_warnings = ["module-not-measured"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict = true
warn_return_any = true
warn_unused_configs = true
strict_optional = true
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
module = ["scipy.*", "h5py.*", "plotly.*", "fooof.*", "specparam.*", "customtkinter.*", "tkinter.*", "PIL.*", "pyautogui.*", "pygetwindow.*", "winreg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["APGI-GUI", "APGI-Simulation-GUI", "Assistant-GUI", "Psychological-States-GUI", "Tests-GUI", "Utils-GUI"]
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["misc", "func-returns-value", "unused-ignore"]

# Note: apgi_gui.* and apgi_framework.* now use strict typing
# Remove overrides to enforce strict type checking across core modules

[[tool.mypy.overrides]]
module = ["api.tasks.experimental_tasks"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["union-attr", "call-arg"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "BLK997"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
    ".tox",
    "htmlcov",
    ".coverage",
    ".pytest_cache",
    ".mypy_cache",
    "coverage_html_report",
]
per-file-ignores = [
    "__init__.py: F401",
    "*/tests/*: E501, BLK997",
    "test_*.py: E501, BLK997",
    "*_test.py: E501, BLK997",
    "examples/*: E501, BLK997",
    "benchmarks/*: E501, BLK997",
    "utils/*: E501, BLK997",
]

# ---------------------------------------------------------------------------
# mutmut – mutation testing
# ---------------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = [
    "apgi_framework/core/active_inference.py",
    "apgi_framework/core/free_energy.py",
    "apgi_framework/core/vp15.py",
    "apgi_framework/core/surprise_dynamics.py",
    "apgi_framework/core/threshold_phenomenon.py",
    "apgi_framework/ignition/threshold.py",
    "apgi_framework/interoception/allostasis.py",
    "apgi_framework/adaptive/quest_plus_staircase.py",
    "apgi_framework/adaptive/stimulus_generators.py",
    "apgi_framework/analysis/analysis_engine.py",
    "apgi_framework/analysis/bayesian_models.py",
    "apgi_framework/clinical/disorder_classification.py",
    "apgi_framework/clinical/parameter_extraction.py",
    "apgi_framework/data/parameter_estimation_dao.py",
    "apgi_framework/accessibility/accessibility_manager.py",
]
test_command = "python -m pytest tests/unit/test_active_inference.py tests/unit/test_vp15_protocol.py tests/unit/test_free_energy.py tests/unit/test_ignition_dynamics.py tests/unit/test_allostasis.py -x -q --no-header"
no_progress_bar = false
use_coverage = false

# Testing Categories Configuration
[testing.categories.unit]
description = "Fast, isolated unit tests"
timeout = 60
parallel = true
max_workers = 4

[testing.categories.integration]
description = "Slower integration tests with external dependencies"
timeout = 300
parallel = false

[testing.categories.gui]
description = "GUI component tests"
timeout = 120
parallel = false
display_required = true

[testing.categories.performance]
description = "Performance benchmarks and load tests"
timeout = 600
parallel = false
baseline_required = true

[testing.categories.research]
description = "Domain-specific research experiments"
timeout = 1800
parallel = false
data_required = true

[testing.structure]
main_dirs = ["tests", "apgi_framework/tests", "research/*/tests"]
patterns = [
    {pattern = "tests/unit/*", category = "unit"},
    {pattern = "tests/integration/*", category = "integration"},
    {pattern = "tests/gui/*", category = "gui"},
    {pattern = "tests/performance/*", category = "performance"},
    {pattern = "benchmarks/*", category = "performance"},
    {pattern = "research/*/tests/*", category = "research"}
]

[testing.reporting]
formats = ["json", "html", "console"]
output_dir = "test_reports"
include_coverage = true
include_performance = true
include_timeline = true

[testing.notifications]
enable_desktop = false
email_on_failure = false
email_recipients = []
slack_webhook = ""
slack_channel = "#testing"

[testing.ci]
platform = "github"
artifacts = [
    "test_reports/*",
    "coverage_html_report/*",
    "coverage.xml"
]

[testing.ci.thresholds]
min_coverage_percent = 80
max_test_duration_seconds = 1800
max_failures = 0
max_errors = 0

[testing.parallel]
enabled = true
default_workers = "auto"
max_workers = 8
exclude_categories = ["integration", "gui", "performance"]

[testing.data]
data_dir = "test_data"
fixtures_dir = "test_fixtures"
auto_generate = false
cleanup_after = true

[testing.environment]
default_env = "test"

[testing.environment.test]
database_url = "${TEST_DATABASE_URL:sqlite:///:memory:}"
debug = true
log_level = "DEBUG"

[testing.environment.ci]
database_url = "${DATABASE_URL}"
debug = false
log_level = "INFO"
mock_external = true