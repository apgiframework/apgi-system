# Semgrep Configuration for APGI System
# Security and style checks for Python codebase

rules:
  # Security Rules
  - id: insecure-password-hashing
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
      # non-security uses (cache keys, ids) opt out explicitly
      - pattern-not: hashlib.md5(..., usedforsecurity=False)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False)
    message: "Insecure hashing algorithm detected. Use bcrypt, argon2, or PBKDF2 for password hashing, or pass usedforsecurity=False for non-security uses."
    severity: ERROR
    languages: [python]

  - id: hardcoded-secret
    pattern-regex: '(?i)\b(password|passwd|secret|secret_key|api_key|apikey|token|access_token)\s*=\s*["''][^"'']{8,}["'']'
    message: "Potential hardcoded secret detected. Use environment variables or a secrets manager."
    severity: WARNING
    languages: [python]

  - id: sql-injection-risk
    pattern-either:
      - pattern: |
          $CURSOR.execute("..." % $VAR)
      - pattern: |
          $CURSOR.execute("...".format($VAR))
      - pattern: |
          $CURSOR.execute(f"...{$VAR}...")
    message: "Potential SQL injection vulnerability. Use parameterized queries."
    severity: ERROR
    languages: [python]

  - id: eval-usage
    pattern: eval($X)
    message: "Dangerous eval() usage detected. Avoid using eval with untrusted input."
    severity: WARNING
    languages: [python]

  - id: exec-usage
    pattern: exec($X)
    message: "Dangerous exec() usage detected. Avoid using exec with untrusted input."
    severity: WARNING
    languages: [python]

  - id: pickle-usage
    pattern-either:
      - pattern: pickle.loads($X)
      - pattern: pickle.load($X)
    message: "Insecure deserialization with pickle. Use json or msgpack for untrusted data."
    severity: WARNING
    languages: [python]

  - id: yaml-unsafe-load
    pattern: yaml.load($X)
    message: "Unsafe YAML loading. Use yaml.safe_load() instead."
    severity: ERROR
    languages: [python]

  - id: subprocess-shell-true
    pattern: subprocess.call(..., shell=True, ...)
    message: "Subprocess with shell=True is dangerous. Avoid when possible."
    severity: WARNING
    languages: [python]

  - id: debug-mode-enabled
    pattern: debug = True
    message: "Debug mode enabled. Disable in production."
    severity: WARNING
    languages: [python]

  # Style and Best Practice Rules
  - id: bare-except
    pattern: |
      except:
        ...
    message: "Bare except clause detected. Catch specific exceptions."
    severity: WARNING
    languages: [python]

  - id: broad-exception-caught
    pattern: |
      except Exception:
        ...
    message: "Broad exception clause. Catch more specific exceptions."
    severity: INFO
    languages: [python]

  - id: mutable-default-argument
    pattern: |
      def $FUNC(..., $ARG=[], ...):
        ...
    message: "Mutable default argument detected. Use None and initialize in function body."
    severity: WARNING
    languages: [python]

  - id: unused-import
    pattern: import $X
    message: "Check for unused imports and remove them."
    severity: INFO
    languages: [python]

  - id: print-statement
    pattern: print(...)
    message: "Print statement detected. Use logging instead."
    severity: INFO
    languages: [python]

  - id: todo-fixme-comment
    pattern-regex: '(?i)(#.*todo|#.*fixme)'
    message: "TODO or FIXME comment found. Consider creating an issue or addressing it."
    severity: INFO
    languages: [python]

  - id: no-docstring
    pattern: |
      def $FUNC($...):
        ...
    message: "Function missing docstring. Add documentation."
    severity: INFO
    languages: [python]

  - id: complex-function
    pattern-regex: 'def\s+\w+\([^)]*\):\s*(?:->\s*\w+\s*)?:\s*\n(?:\s+[^\n]*\n){50,}'
    message: "Function may be too complex. Consider refactoring."
    severity: INFO
    languages: [python]

  # API Security Rules
  - id: missing-authentication
    pattern-regex: '@(app\.|router\.)?(get|post|put|delete|patch)\s*\([^)]*\)\s*\n\s*async\s+def\s+\w+'
    message: "API endpoint may be missing authentication. Verify auth requirements."
    severity: INFO
    languages: [python]

  - id: sensitive-data-in-logs
    # a variable whose name suggests a secret is interpolated into a log message
    pattern-regex: 'logger\.(info|debug|warning|error|exception)\s*\(\s*f["''][^"'']*\{[^}]*(password|passwd|secret|token|credential)[^}]*\}'
    message: "A secret-named variable is interpolated into a log message. Log an identifier or a redacted value instead."
    severity: ERROR
    languages: [python]

  # Performance Rules
  - id: list-comprehension-in-all
    pattern: all([$X for $Y in $Z])
    message: "Use generator expression instead of list comprehension with all()."
    severity: INFO
    languages: [python]

  - id: list-comprehension-in-any
    pattern: any([$X for $Y in $Z])
    message: "Use generator expression instead of list comprehension with any()."
    severity: INFO
    languages: [python]

  - id: inefficient-dict-keys
    pattern: $X.keys()
    message: "Unnecessary .keys() call. Use 'for key in dict' or 'key in dict' instead."
    severity: INFO
    languages: [python]
